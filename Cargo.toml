[package]
name = "solve"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[[bin]]
name = "solve"
path = "src/main.rs"

[[bin]]
name = "traingen"
path = "src/bin/traingen.rs"

[dependencies]
memchr = "2"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
overflow-checks = false
